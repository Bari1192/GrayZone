# fly.toml app configuration file generated for grayzone-frontend on 2025-06-09T19:24:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'grayzone-frontend'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[env]
  NODE_ENV = "development"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
